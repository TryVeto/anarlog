name: Desktop Store Status

on:
  workflow_dispatch:
    inputs:
      submission_id:
        description: "Existing Microsoft Store submission ID to inspect"
        required: true
        type: string

permissions: {}

jobs:
  status:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - shell: pwsh
        env:
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          AZURE_AD_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          MICROSOFT_STORE_PRODUCT_ID: ${{ vars.MICROSOFT_STORE_PRODUCT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          SUBMISSION_ID: ${{ inputs.submission_id }}
        run: |
          $ErrorActionPreference = "Stop"

          if ($env:SUBMISSION_ID -notmatch '^[0-9]+$') {
            throw "Submission ID must contain only digits"
          }
          $productId = [guid]::Parse($env:MICROSOFT_STORE_PRODUCT_ID).ToString()
          $tenantId = [guid]::Parse($env:AZURE_AD_TENANT_ID).ToString()
          $token = Invoke-RestMethod -Method Post -TimeoutSec 60 `
            -Uri "https://login.microsoftonline.com/$tenantId/oauth2/v2.0/token" `
            -Body @{
              grant_type = "client_credentials"
              client_id = $env:AZURE_AD_APPLICATION_CLIENT_ID
              client_secret = $env:AZURE_AD_APPLICATION_SECRET
              scope = "https://api.store.microsoft.com/.default"
            }
          if (-not $token.access_token) {
            throw "Microsoft authentication returned no access token"
          }
          Write-Output "::add-mask::$($token.access_token)"
          $headers = @{
            Authorization = "Bearer $($token.access_token)"
            "X-Seller-Account-Id" = $env:SELLER_ID
          }
          $base = "https://api.store.microsoft.com/submission/v1/product/$productId"
          $queries = [ordered]@{
            moduleReadiness = "$base/status"
            submissionStatus = "$base/submission/$($env:SUBMISSION_ID)/status"
            currentDraftPackages = "$base/packages"
          }
          foreach ($query in $queries.GetEnumerator()) {
            $response = Invoke-WebRequest -Method Get -Uri $query.Value `
              -Headers $headers -TimeoutSec 60 -SkipHttpErrorCheck
            Write-Output "$($query.Key): HTTP $([int]$response.StatusCode); correlation=$($response.Headers['X-Correlation-ID']); retry-after=$($response.Headers['Retry-After'])"
            if ([int]$response.StatusCode -ne 200) {
              throw "Store status request failed; respect Retry-After before another run"
            }
            $result = $response.Content | ConvertFrom-Json
            $result | ConvertTo-Json -Depth 20
            if ($result.isSuccess -ne $true) {
              throw "Store API reported failure for $($query.Key)"
            }
          }
